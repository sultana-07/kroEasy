  <!-- ════ SPLASH SCREEN STYLES (renders instantly before JS loads) ════════ -->
  <style>
    #splash-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(165deg, #0F0A1E 0%, #1E0A4A 40%, #7C3AED 100%);
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    #splash-screen.hide {
      opacity: 0;
      visibility: hidden;
    }

    #splash-logo {
      width: 88px;
      height: 88px;
      animation: splash-bounce 1.3s ease-in-out;
      filter: drop-shadow(0 8px 24px rgba(124,58,237,0.55));
    }

    #splash-name {
      font-size: 34px;
      font-weight: 900;
      color: white;
      letter-spacing: -0.5px;
      margin-top: 8px;
      opacity: 0;
      animation: splash-fade-up 0.7s ease forwards 0.7s;
    }

    #splash-tagline {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.7);
      margin-top: 6px;
      opacity: 0;
      animation: splash-fade-up 0.7s ease forwards 1.1s;
    }

    #splash-loader {
      margin-top: 32px;
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-top-color: #F97316;
      border-radius: 50%;
      opacity: 0;
      animation: splash-spin 0.8s linear infinite, splash-fade-up 0.4s ease forwards 1.6s;
    }

    @keyframes splash-bounce {
      0% {
        transform: scale(0.3) rotate(-10deg);
        opacity: 0;
      }

      50% {
        transform: scale(1.15) rotate(3deg);
        opacity: 1;
      }

      100% {
        transform: scale(1) rotate(0);
        opacity: 1;
      }
    }

    @keyframes splash-fade-up {
      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes splash-spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
